name: Build Limgrow OmniRoute hotfix

on:
  push:
    branches:
      - codex/build-antigravity-refresh-image

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'baopqt894/OmniRoute'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build release image
        env:
          IMAGE: limgrow/omniroute:3.8.52-antigravity-refresh
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 --target runner-base \
            --build-arg OMNIROUTE_USE_TURBOPACK=0 \
            --build-arg OMNIROUTE_BUILD_MEMORY_MB=12288 \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "$IMAGE" .

          docker run -d --name hotfix-smoke -p 127.0.0.1:20128:20128 \
            -e OMNIROUTE_DISABLE_TOKEN_HEALTHCHECK=1 "$IMAGE"
          trap 'docker rm -f hotfix-smoke >/dev/null' EXIT
          curl -fsS --retry 30 --retry-all-errors --retry-delay 3 --max-time 5 \
            http://127.0.0.1:20128/healthz

          mkdir dist-image
          docker save "$IMAGE" | gzip -1 > dist-image/omniroute.tar.gz
          cd dist-image
          sha256sum omniroute.tar.gz > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: omniroute-3.8.52-antigravity-refresh-amd64
          path: dist-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
